name: Android APK

# Every `v*` tag produces a sideloadable APK attached to the GitHub Release.
# Tags must look like vMAJOR.MINOR.PATCH — that tag also becomes the app version.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build sideloadable APK
    runs-on: ubuntu-latest
    env:
      # Optional. Set these repository secrets to pin one debug keystore across
      # runs so a new APK can upgrade an existing install. Without them every
      # build gets its own throwaway keystore, and only the most recent APK can
      # be installed on a given tablet (uninstall the old one first).
      ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
      ANDROID_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
      ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
      ANDROID_DEBUG_STORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_STORE_PASSWORD }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Install dependencies
        run: npm ci

      - name: Derive version from tag
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' must look like vMAJOR.MINOR.PATCH"
            exit 1
          fi
          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))
          # Monotonic versionCode so Android accepts upgrades.
          code=$((major * 1000000 + minor * 1000 + patch))
          if ((code <= 0 || code >= 2100000000)); then
            echo "::error::Version $version maps to out-of-range versionCode $code"
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # Tests run as part of `npm run build`, so this also gates on them.
      - name: Build web app and sync native project
        run: npm run android:sync

      - name: Restore signing keystore
        if: env.ANDROID_DEBUG_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/kestrels-debug.keystore"
          encoded="$(printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]')"
          if ! printf '%s' "$encoded" | base64 --decode > "$keystore" 2>/dev/null; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_BASE64 is not valid base64 (got ${#encoded} chars). Re-set it from 'base64 -i kestrels-debug.keystore'."
            exit 1
          fi
          if [ ! -s "$keystore" ]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_BASE64 decoded to an empty file."
            exit 1
          fi
          echo "Restored $(wc -c < "$keystore") byte keystore."
          echo "ANDROID_DEBUG_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Assemble APK
        run: |
          set -euo pipefail
          ./android/gradlew -p android assembleDebug \
            --no-daemon \
            -PkestrelsVersionName="${{ steps.version.outputs.name }}" \
            -PkestrelsVersionCode="${{ steps.version.outputs.code }}"

      - name: Collect APK
        id: collect
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          name="kestrels-v${VERSION}-android.apk"
          mkdir -p dist-android
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist-android/$name"
          echo "path=dist-android/$name" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: kestrels-apk-${{ steps.version.outputs.name }}
          path: ${{ steps.collect.outputs.path }}
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Kestrels ${{ steps.version.outputs.name }}
          files: ${{ steps.collect.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Summarise
        env:
          VERSION: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
          KEYSTORE_PINNED: ${{ env.ANDROID_DEBUG_KEYSTORE_BASE64 != '' }}
        run: |
          {
            echo "### Android APK v$VERSION"
            echo
            echo "- APK: \`${{ steps.collect.outputs.path }}\`"
            echo "- versionName: \`$VERSION\` (versionCode \`$CODE\`)"
            echo "- Install: copy the APK to the tablet and open it (allow \"install unknown apps\")."
            if [ "$KEYSTORE_PINNED" != "true" ]; then
              echo "- Note: signed with a throwaway CI keystore. Uninstall any previous build before installing."
            fi
          } >> "$GITHUB_STEP_SUMMARY"