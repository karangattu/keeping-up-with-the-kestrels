<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bird flight review</title>
  <style>
    body { margin: 0; padding: 24px; background: #eef4f2; color: #153b3c; font: 16px system-ui; }
    main { max-width: 1080px; margin: auto; }
    h1 { margin-bottom: 8px; font-size: 28px; }
    p { margin-top: 0; }
    .controls { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; margin: 20px 0; }
    button { padding: 9px 18px; border: 1px solid #7ca09b; border-radius: 8px; background: white; color: inherit; font: inherit; cursor: pointer; }
    canvas { display: block; width: 100%; border-radius: 12px; background: #d9e9e4; }
  </style>
</head>
<body><main>
  <h1>Bird flight review</h1>
  <p>All 11 bird variants, using the game's flight frames and wingbeat timing.</p>
  <div class="controls">
    <button id="pause">Pause</button>
    <label>Playback speed <input id="speed" type="range" min="0.1" max="1.5" value="1" step="0.1" /> <span id="speed-value">1×</span></label>
    <button id="direction">Face left</button>
  </div>
  <canvas id="birds" aria-label="Animated flight cycles for all bird species"></canvas>
  <script type="module" src="/src/flightPreview.ts"></script>
</main></body>
</html>
