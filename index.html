<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#102a2f" />
    <meta
      name="description"
      content="A one-minute raptor counting game for learning Bay Area birds of prey."
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <title>Keeping Up with the Kestrels</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Suppress errors from browser extensions that inject scripts (e.g. searchAnalyzer.js).
      (function () {
        var EXTENSION_PATTERNS = [/searchAnalyzer\.js/i, /Search engine .* is not supported/i];
        function isExtensionError(error) {
          if (!error) return false;
          var message = typeof error === "string" ? error : error.message || "";
          var filename = error.filename || "";
          return EXTENSION_PATTERNS.some(function (pattern) {
            return pattern.test(message) || pattern.test(filename);
          });
        }
        window.addEventListener("error", function (event) {
          if (isExtensionError(event.error) || isExtensionError(event)) {
            event.preventDefault();
            console.warn("Suppressed browser-extension error:", event.error || event.message);
            return false;
          }
        });
        window.addEventListener("unhandledrejection", function (event) {
          var reason = event.reason;
          if (reason && (isExtensionError(reason) || isExtensionError(reason.message || reason))) {
            event.preventDefault();
            console.warn("Suppressed browser-extension rejection:", reason);
            return false;
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
